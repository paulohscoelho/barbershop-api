server:
  port: ${PORT:8080}

spring:
  application:
    name: barbershop-api

  main:
    banner-mode: "off"

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

api:
  security:
    token:
      secret: ${JWT_SECRET}